name: nnAudio
on:
  push:
    branches:
      - main
      - master
      - update
      - workflow
  pull_request:
    branches:
      - master
jobs:
  build:
    # ubuntu-latest (26.04) has no Python 3.8 or 3.9, and torch < 1.13 fails to import there
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10']
        torch-version: ['1.11.0', '1.12.0', '1.13.0', '2.1.0']
        exclude:
            # excludes torch 2.1 on older python versions
            - python-version: '3.8'
              torch-version: '2.1.0'
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies pytorch version == ${{ matrix.torch-version }}
        run: |
          sudo apt-get install libsndfile1-dev
          python -m pip install --upgrade pip
          # torch < 2.3 was built against NumPy 1.x
          pip install torch==${{matrix.torch-version}} "numpy<2"
          pip install pytest
          pip install librosa
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Test with pytest
        run: |
          cd Installation/ && pytest
